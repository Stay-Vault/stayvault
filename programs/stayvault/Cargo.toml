[package]
name = "stayvault"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stayvault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.14.0"
agave-feature-set = "=4.1.2"
agave-precompiles = "=4.1.2"
agave-reserved-account-keys = "=4.1.2"
solana-account = "=4.3.1"
